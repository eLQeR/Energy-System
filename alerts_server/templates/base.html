<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Панель моніторингу — EnergyLab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">EL</div>
      <div>
        <div>EnergyLab</div>
        <div style="font-size:11px;color:var(--text-muted);font-weight:400;">
          Панель інженера - EnergyLab
        </div>
      </div>
    </div>
    <nav class="topnav">
      <a href="/" data-nav="dashboard">Огляд</a>
      <a href="/dashboards" data-nav="dashboards">Метрики</a>
      <a href="/ontology" data-nav="ontology">Онтологія</a>
      <a href="/upload" data-nav="upload">Завантаження паспортів</a>
    </nav>
    <div class="meta">
      <span><span id="live-dot" class="live-dot"></span>
            <span id="live-status">оновлення кожні 5 с</span></span>
      <span id="now-clock"></span>
      <a href="/docs" title="OpenAPI / Swagger">API</a>
    </div>
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/common.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
